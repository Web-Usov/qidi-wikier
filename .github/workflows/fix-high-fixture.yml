name: Fix high-priority fixture

on:
  push:
    branches:
      - agent/bootstrap-qidi-wikier
    paths:
      - .github/workflows/fix-high-fixture.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bootstrap-qidi-wikier
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Align root problem text
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('test/knowledge.test.ts')
          text = path.read_text(encoding='utf-8')
          old = 'text: "PETG на QIDI Q2 ломается по слоям. Как улучшить межслойку?",'
          new = 'text: "PETG на QIDI Q2 расслаивается по слоям. Что изменить?",'
          if old not in text:
              raise SystemExit('Expected fixture root not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Verify all tests
        run: |
          npm run check
          npm test
      - name: Commit fixture
        run: |
          git config user.name "qidi-wikier-actions"
          git config user.email "actions@users.noreply.github.com"
          git add test/knowledge.test.ts
          git commit -m "Align high-priority cluster fixture roots"
          git push origin HEAD:agent/bootstrap-qidi-wikier
