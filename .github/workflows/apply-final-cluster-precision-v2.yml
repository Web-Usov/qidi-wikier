name: Apply final cluster precision v2

on:
  push:
    branches:
      - agent/bootstrap-qidi-wikier
    paths:
      - .github/workflows/apply-final-cluster-precision-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bootstrap-qidi-wikier
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply precision patch
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/knowledge.ts')
          text = path.read_text(encoding='utf-8')
          replacements = [
            (r'''["bed-adhesion", /(?:адгези.{0,18}(?:стол|платформ)|не\s+лип|отлип|прилип|клей|адгезив|перв(?:ый|ого)\s+сло.{0,20}(?:стол|лип|платформ))/iu],''', r'''["bed-adhesion", /(?:адгези.{0,18}(?:стол|платформ)|не\s+лип|отлип|прилип|перв(?:ый|ого)\s+сло.{0,20}(?:стол|лип|платформ)|(?:клей|адгезив).{0,25}(?:стол|пластин|перв(?:ый|ого)\s+сло)|(?:стол|пластин|перв(?:ый|ого)\s+сло).{0,25}(?:клей|адгезив))/iu],''', 'bed adhesion'),
            (r'''["drying", /(?:сушк|сушил|сушить|влажн)/iu],''', r'''["drying", /(?:сушк|сушить|влажн|температур.{0,18}суш|суш.{0,18}температур)/iu],''', 'drying'),
            (r'''["mcu-error", /(?:mcu|shutdown|missed\s+scheduling|timer\s+too\s+close|lost\s+communication)/iu],''', r'''["mcu-error", /(?:(?:mcu|klippy).{0,55}(?:ошиб|error|shutdown|не\s+наход|lost|отвал|disconnect)|(?:shutdown|missed\s+scheduling|timer\s+too\s+close|lost\s+communication).{0,55}(?:mcu|klippy)?)/iu],''', 'mcu error'),
            (r'''["box-connection", /(?:(?:box|бокс).{0,35}(?:не\s+вид|подключ|соедин|коннект|индикац)|(?:не\s+вид|подключ|соедин|коннект).{0,35}(?:box|бокс))/iu],''', r'''["box-connection", /(?:(?:box|бокс).{0,45}(?:не\s+(?:вид|определ|обнаруж|подключ|соедин|работ)|ошиб.{0,12}(?:подключ|соедин)|как\s+подключ)|(?:не\s+(?:вид|определ|обнаруж|подключ|соедин)|как\s+подключ).{0,45}(?:box|бокс))/iu],''', 'box connection'),
            (r'''["extruder-feed", /(?:экструдер|шестерн|подач.{0,20}(?:пластик|филамент))/iu],''', r'''["extruder-feed", /(?:заж[её]в|застр|закус|не\s+(?:проходит|проталкива)|пробуксов|шестерн.{0,25}(?:экстру|подач|филамент)|подач.{0,25}(?:не\s|проблем|пропуск)|экструдер.{0,35}(?:заж[её]в|застр|закус|не\s+пода|пробуксов|шестерн))/iu],''', 'extruder feed'),
          ]
          for old, new, label in replacements:
              if old not in text:
                  raise SystemExit(f'{label} pattern not found')
              text = text.replace(old, new, 1)

          old_scope = '  const rootProfile = extractEntities(rootContext(candidate));\n  const profile = hasScopeAnchors(rootProfile) ? rootProfile : candidate.entities;\n  const materialFamilies = uniqueSorted(profile.materialFamilies);'
          new_scope = '  const profile = extractEntities(rootContext(candidate));\n  const materialFamilies = uniqueSorted(profile.materialFamilies);'
          if old_scope not in text:
              raise SystemExit('scope fallback block not found')
          text = text.replace(old_scope, new_scope, 1)

          start = text.find('function hasScopeAnchors(profile: EntityProfile): boolean {')
          end = text.find('\n}\n\nfunction scopeOf', start)
          if start < 0 or end < 0:
              raise SystemExit('hasScopeAnchors function not found')
          text = text[:start] + text[end + 3:]

          fingerprint = '''function supportFingerprint(candidate: ClusterableEvidenceCandidate): string {
            return createHash("sha256").update(normalizedSupportText(candidate)).digest("hex").slice(0, 16);
          }
          '''.replace('          ', '')
          coherence = fingerprint + '''
          const ROOT_STOPWORDS = new Set([
            "qidi", "принтер", "принтера", "принтере", "печать", "печати", "печатать", "печатаю",
            "вопрос", "подскажите", "помогите", "привет", "всем", "кто", "что", "как", "какой", "какая",
            "какие", "может", "можно", "нужно", "надо", "есть", "это", "этот", "эта", "для", "при", "после",
            "перед", "или", "уже", "только", "очень", "вообще", "проблема", "проблемой", "стал", "стала",
          ]);

          function rootTokens(candidate: ClusterableEvidenceCandidate): Set<string> {
            const normalized = rootContext(candidate)
              .replace(/https?:\\/\\/\\S+/giu, " ")
              .toLowerCase()
              .replace(/ё/gu, "е");
            const words = normalized.match(/[\\p{L}\\p{N}+#.-]{3,}/gu) ?? [];
            return new Set(words
              .map((word) => word.replace(/^[^\\p{L}\\p{N}]+|[^\\p{L}\\p{N}+#.-]+$/gu, ""))
              .filter((word) => word.length >= 3 && !ROOT_STOPWORDS.has(word))
              .map((word) => word.length > 7 ? word.slice(0, 7) : word));
          }

          function rootsSimilar(first: ClusterableEvidenceCandidate, second: ClusterableEvidenceCandidate): boolean {
            const left = rootTokens(first);
            const right = rootTokens(second);
            if (left.size === 0 || right.size === 0) return false;
            let shared = 0;
            for (const token of left) if (right.has(token)) shared += 1;
            const union = left.size + right.size - shared;
            return shared >= 3 || (shared >= 2 && union > 0 && shared / union >= 0.22);
          }

          function coherentSupport(support: ClusterableEvidenceCandidate[]): boolean {
            if (support.length < 2) return false;
            const everyCandidateHasPeer = support.every((candidate, index) => support.some((peer, peerIndex) => (
              index !== peerIndex && rootsSimilar(candidate, peer)
            )));
            const crossSourcePair = support.some((candidate, index) => support.some((peer, peerIndex) => (
              index !== peerIndex
              && candidate.sourceName !== peer.sourceName
              && rootsSimilar(candidate, peer)
            )));
            return everyCandidateHasPeer && crossSourcePair;
          }
          '''.replace('          ', '')
          if fingerprint not in text:
              raise SystemExit('supportFingerprint function not found')
          text = text.replace(fingerprint, coherence, 1)

          high_tail = '      && supportRatio >= 0.5\n      && evidence.length <= 20;'
          high_new = '      && supportRatio >= 0.5\n      && evidence.length <= 20\n      && coherentSupport(supportEvidence);'
          if high_tail not in text:
              raise SystemExit('high priority tail not found')
          text = text.replace(high_tail, high_new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify
        run: |
          npm run check
          npm test
      - name: Commit patch
        run: |
          git config user.name "qidi-wikier-actions"
          git config user.email "actions@users.noreply.github.com"
          git add src/knowledge.ts
          git commit -m "Require coherent root cases for high-priority clusters"
          git push origin HEAD:agent/bootstrap-qidi-wikier

# retry after aligning medium-priority fixture
