name: Diagnose test files

on:
  push:
    branches:
      - agent/bootstrap-qidi-wikier
    paths:
      - .github/workflows/diagnose-tests.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bootstrap-qidi-wikier
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run test files separately
        id: tests
        shell: bash
        run: |
          set +e
          : > /tmp/results.txt
          failed=0
          for file in test/*.test.ts; do
            echo "=== $file ===" | tee -a /tmp/results.txt
            node --test --experimental-strip-types "$file" > /tmp/one.log 2>&1
            code=$?
            grep -E '^(not ok|# fail|# pass|# tests|  error:|  actual:|  expected:|  operator:|  stack:)' /tmp/one.log | tail -n 30 | tee -a /tmp/results.txt
            echo "exit=$code" | tee -a /tmp/results.txt
            if [[ $code -ne 0 ]]; then failed=1; fi
          done
          cat /tmp/results.txt
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
      - name: Commit diagnostic report
        run: |
          cp /tmp/results.txt test-diagnostics.txt
          git config user.name "qidi-wikier-actions"
          git config user.email "actions@users.noreply.github.com"
          git add test-diagnostics.txt
          git commit -m "Record isolated test diagnostics"
          git push origin HEAD:agent/bootstrap-qidi-wikier
