name: Apply knowledge type cleanup

on:
  push:
    branches:
      - agent/bootstrap-qidi-wikier
    paths:
      - .github/workflows/apply-knowledge-type-cleanup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bootstrap-qidi-wikier
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require evidence schema v3 provenance
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('src/knowledge.ts')
          text = path.read_text(encoding='utf-8')
          old_import = 'import type { EvidenceCandidate, EvidenceParameter } from "./evidence.ts";'
          new_import = 'import type { EvidenceCandidate, EvidenceParameter } from "./evidence.ts";'
          if old_import not in text:
              raise SystemExit('Evidence import not found')
          block = '''export interface EvidenceSourceMessage {
            id: number;
            author: string;
            authorId: string;
            date: string;
            replyTo?: number;
            text: string;
            hasMedia: boolean;
          }

          export interface ClusterableEvidenceCandidate extends EvidenceCandidate {
            sourceName?: string;
            sourceMessages?: EvidenceSourceMessage[];
          }
          '''.replace('          ', '')
          if block not in text:
              raise SystemExit('Optional provenance block not found')
          text = text.replace(block, 'export type ClusterableEvidenceCandidate = EvidenceCandidate;\n', 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify
        run: |
          npm run check
          npm test
      - name: Commit cleanup
        run: |
          git config user.name "qidi-wikier-actions"
          git config user.email "actions@users.noreply.github.com"
          git add src/knowledge.ts
          git commit -m "Require evidence schema v3 provenance"
          git push origin HEAD:agent/bootstrap-qidi-wikier
