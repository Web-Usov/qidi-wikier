name: Apply evidence hotfix

on:
  push:
    branches:
      - agent/bootstrap-qidi-wikier
    paths:
      - .github/workflows/apply-evidence-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bootstrap-qidi-wikier
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply exact evidence patch
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/evidence.ts')
          text = path.read_text(encoding='utf-8')

          old_explanatory = 'const EXPLANATORY_ANSWER = /^(?:это|потому|значит|зависит|скорее|похоже|разница|причина|процент|угол|перекрытие|заходишь|выбираешь|ставишь|смотри|фильтр|скорость|температура|сопло|стол|камера|поток|ретракт|кабель|питание|питалово|выключить|включить|без\\s+адгезива|с\\s+адгезивом|клей|адгезив)/iu;'
          new_explanatory = 'const EXPLANATORY_ANSWER = /^(?:это|потому|значит|зависит|скорее|похоже|разница|причина)/iu;'
          if old_explanatory not in text:
              raise SystemExit('Expected EXPLANATORY_ANSWER pattern was not found')
          text = text.replace(old_explanatory, new_explanatory, 1)

          pointer = 'const POINTER_ONLY = /^(?:в\\s+лс|выше|ниже|в\\s+(?:этой\\s+)?теме|в\\s+закрепе|в\\s+(?:вики|wiki)|в\\s+статьях|по\\s+ссылке|гугли|ищи|уже\\s+есть\\s+готовые\\s+решения)[.!… ]*$/iu;'
          photo = pointer + '\nconst PHOTO_REQUEST = /(?:есть|можно|покаж|скинь|пришли|отправ).{0,30}(?:фото|фотк|изображ|скрин|вид)/iu;'
          if pointer not in text:
              raise SystemExit('Expected POINTER_ONLY pattern was not found')
          text = text.replace(pointer, photo, 1)

          guard = '  if (!text || evidenceQuestionLike(text) || NON_ANSWER.test(text) || POINTER_ONLY.test(text)) return false;'
          replacement = guard + '\n  if (PHOTO_REQUEST.test(questionText) && !/(?:https?:\\/\\/|\\[Вложение:)/iu.test(message.text)) return false;'
          if guard not in text:
              raise SystemExit('Expected answer guard was not found')
          text = text.replace(guard, replacement, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify
        run: |
          npm run check
          npm test

      - name: Commit patch
        run: |
          git config user.name "qidi-wikier-actions"
          git config user.email "actions@users.noreply.github.com"
          git add src/evidence.ts
          git commit -m "Fix photo-request answer classification"
          git push origin HEAD:agent/bootstrap-qidi-wikier
